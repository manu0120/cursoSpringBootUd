spring.application.name=springboot-error

# Deshabilita los mapeos de recursos estáticos.
# Si no ponemos esto, las rutas sin controller son interceptadas por
# los resource handlers (static/, public/) y nunca llega a lanzarse
# NoHandlerFoundException.
# ⚠️  En Spring Boot 4+ (Spring 7+) la excepción NoHandlerFoundException
#     se lanza SIEMPRE por defecto, ya no necesita propiedad extra.
spring.web.resources.add-mappings=false
