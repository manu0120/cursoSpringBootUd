<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Document</title>
</head>
<body>
    <h1 th:text="${title}"></h1>
    <div th:if="${users.size() == 0}">
        <span>¡No hay usuarios!</span>
    </div>
    <div th:unless="${users.size() == 0}">
        <ul>
            <li th:each="user : ${users}">
                <ul>
                    <li th:text="${user.name}"></li>
                    <li th:text="${user.lastName}"></li>
                    <li th:if="${user.email}" th:text="${user.email}"></li>
                    <!-- <li th:if="${not (user.email != null)}" th:text="'El usuario no tiene email'"></li> -->
                    <li th:unless="${user.email}" th:text="'El usuario no tiene email'"></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
